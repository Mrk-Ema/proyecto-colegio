<div class="container mt-5" style="max-width: 420px;">
    <h3 class="mb-3">Iniciar sesión</h3>
    <div class="mb-3">
        <label class="form-label">Correo</label>
        <input class="form-control" [(ngModel)]="correo" type="email" placeholder="superadmin@colegio.edu">
    </div>
    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input class="form-control" [(ngModel)]="password" type="password" placeholder="•••">
    </div>
    @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
    }
    <button class="btn btn-primary w-100" (click)="ingresar()">Entrar</button>
    <div class="mt-3 text-center">
      <a routerLink="/recuperar">¿Olvidaste tu contraseña?</a>
    </div>
</div>
