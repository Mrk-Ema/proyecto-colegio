<div class="container mt-5" style="max-width: 420px;">
  <h3 class="mb-3">Recuperar contraseña</h3>
  <div class="mb-3">
    <label class="form-label">Correo</label>
    <input class="form-control" [(ngModel)]="correo" type="email">
  </div>
  <div class="mb-3">
    <label class="form-label">Fecha de nacimiento</label>
    <input class="form-control" [(ngModel)]="fechaNacimiento" type="date">
  </div>
  <div class="mb-3">
    <label class="form-label">Nueva contraseña</label>
    <input class="form-control" [(ngModel)]="nueva" type="password">
  </div>
  <div class="mb-3">
    <label class="form-label">Confirmar nueva</label>
    <input class="form-control" [(ngModel)]="confirmar" type="password">
  </div>
  @if (mensaje) {
    <div class="alert alert-success">{{ mensaje }}</div>
  }
  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }
  <button class="btn btn-primary w-100" (click)="enviar()">Restablecer</button>
  <div class="mt-3 text-center">
    <a routerLink="/login">Volver al login</a>
  </div>
</div>
