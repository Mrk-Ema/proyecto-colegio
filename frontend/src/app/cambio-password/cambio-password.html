<h3>Cambiar contraseña</h3>
<div style="max-width: 420px;">
  <div class="mb-3">
    <label class="form-label">Contraseña actual</label>
    <input class="form-control" [(ngModel)]="actual" type="password">
  </div>
  <div class="mb-3">
    <label class="form-label">Nueva contraseña</label>
    <input class="form-control" [(ngModel)]="nueva" type="password">
  </div>
  <div class="mb-3">
    <label class="form-label">Confirmar nueva</label>
    <input class="form-control" [(ngModel)]="confirmar" type="password">
  </div>
  @if (mensaje) {
    <div class="alert alert-success">{{ mensaje }}</div>
  }
  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }
  <button class="btn btn-primary me-2" (click)="guardar()">Guardar</button>
  <button class="btn btn-secondary" (click)="volver()">Volver</button>
</div>
