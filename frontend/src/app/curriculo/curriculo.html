<h3>Currículo</h3>
<div class="row g-2 mb-3">
  <div class="col">
    <select class="form-select" [(ngModel)]="idGrado" (change)="cargar()">
      <option [ngValue]="null">Seleccione grado</option>
      @for (grupo of gruposGrados(); track grupo.etiqueta) {
        <optgroup [label]="grupo.etiqueta">
          @for (g of grupo.opciones; track g.idGrado) {
            <option [ngValue]="g.idGrado">{{ g.nombre }}</option>
          }
        </optgroup>
      }
    </select>
  </div>
  <div class="col">
    <select class="form-select" [(ngModel)]="contexto" (change)="cargar()">
      <option value="defecto">Estructura por defecto</option>
      @for (a of anios; track a.anio) {
        <option [value]="a.anio">{{ a.anio }} ({{ a.estado }})</option>
      }
    </select>
  </div>
</div>
@if (mensaje) {
  <div class="alert alert-info">{{ mensaje }}</div>
}
@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}
<div class="card mb-2">
  <div class="card-body">
    @for (fila of filas(); track $index) {
      <div class="row">
        @for (c of fila; track c.idCurso) {
          <div class="col-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" [checked]="estaMarcado(c.idCurso)" (change)="alternar(c.idCurso)" [disabled]="soloLectura" id="c{{ c.idCurso }}" />
              <label class="form-check-label" for="c{{ c.idCurso }}">{{ c.nombre }}</label>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
@if (soloLectura) {
  <div class="alert alert-warning mt-2">Año Cerrado: solo lectura.</div>
} @else {
  <button class="mt-2" [class.btn]="true" [class.btn-outline-secondary]="!esModificado()" [class.btn-danger]="esModificado()" [disabled]="!esModificado()" (click)="guardar()">{{ existe ? 'Modificar' : 'Crear' }} currículo</button>
}
