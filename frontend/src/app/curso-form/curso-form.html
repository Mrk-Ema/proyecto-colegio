<h3>{{ esEditar ? 'Modificar curso' : 'Nuevo curso' }}</h3>
<div style="max-width: 520px;">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input class="form-control" [(ngModel)]="nombre" />
  </div>
  @if (!esEditar) {
    <h5 class="form-label">Grados donde se imparte (opcional)</h5>
    @for (grupo of grupos(); track grupo.titulo) {
      <h6 class="mt-3">{{ grupo.titulo }}</h6>
      @for (fila of grupo.filas; track $index) {
        <div class="row">
          @for (g of fila; track g.idGrado) {
            <div class="col-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [checked]="g.marcado" (change)="alternar(g)" id="g{{ g.idGrado }}" />
                <label class="form-check-label" for="g{{ g.idGrado }}">{{ g.nombre }}</label>
              </div>
            </div>
          }
        </div>
      }
    }
  }
  @if (error) {
    <div class="alert alert-danger mt-2">{{ error }}</div>
  }
  <button class="btn btn-primary mt-2" (click)="guardar()">Guardar</button>
</div>
