<h3>{{ esEditar ? 'Modificar curso' : 'Nuevo curso' }}</h3>
<div style="max-width: 520px;">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input class="form-control" [(ngModel)]="nombre" />
  </div>
  @if (!esEditar) {
    <label class="form-label">Grados donde se imparte (opcional)</label>
    @for (g of grados; track g.idGrado) {
      <div class="form-check">
        <input class="form-check-input" type="checkbox" [checked]="g.marcado" (change)="alternar(g)" id="g{{ g.idGrado }}" />
        <label class="form-check-label" for="g{{ g.idGrado }}">{{ g.nombre }} ({{ g.nivel }})</label>
      </div>
    }
  }
  @if (error) {
    <div class="alert alert-danger mt-2">{{ error }}</div>
  }
  <button class="btn btn-primary mt-2" (click)="guardar()">Guardar</button>
</div>
